<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Sync - Google Auth</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn {
      background: white;
      color: #333;
      border: 2px solid #e0e0e0;
    }

    .google-btn:hover {
      background: #f9f9f9;
      border-color: #d0d0d0;
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .status.loading {
      background: #e3f2fd;
      color: #1976d2;
      display: block;
    }

    .status.success {
      background: #e8f5e9;
      color: #388e3c;
      display: block;
    }

    .status.error {
      background: #ffebee;
      color: #d32f2f;
      display: block;
    }

    .info-box {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 12px;
      margin-top: 20px;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">📅</div>
      <h1>Meet Sync</h1>
      <p class="subtitle">Google Authentication</p>
    </div>

    <div class="button-group">
      <button class="google-btn" id="googleAuthBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c6.627 0 12 5.373 12 12s-5.373 12-12 12S0 18.627 0 12 5.373 0 12 0z" fill="#fff"/>
          <path d="M12 0c6.627 0 12 5.373 12 12s-5.373 12-12 12S0 18.627 0 12 5.373 0 12 0z" fill="#4285F4" opacity="0.2"/>
          <text x="12" y="16" text-anchor="middle" font-size="16" font-weight="bold" fill="#4285F4">G</text>
        </svg>
        Connect with Google
      </button>
    </div>

    <div class="status" id="status"></div>

    <div id="tokenDisplay" style="display: none; margin-top: 20px; background: #f0f7ff; border: 1px solid #4285F4; border-radius: 6px; padding: 15px; font-size: 12px;">
      <div style="margin-bottom: 10px;">
        <strong style="color: #1976d2;">✓ Welcome!</strong>
        <div style="margin-top: 5px; color: #333;" id="userInfo"></div>
      </div>
      <div style="background: #fff; border-radius: 4px; padding: 10px; margin-bottom: 10px; word-break: break-all; max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 11px;" id="tokenBox"></div>
      <button onclick="copyToken()" style="background: #4285F4; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 11px;">Copy JWT Token</button>
    </div>

    <div class="info-box">
      <strong>What this does:</strong><br>
      Sign in with your Google account. We'll automatically set up your account and connect Google Sheets for event management.
    </div>
  </div>

  <script src="/auth.js"></script>
</body>
</html>
